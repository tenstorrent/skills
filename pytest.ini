[pytest]
# Keep pytest's temp dirs small on shared hosts: a passing test's tmp_path is removed when it ends,
# a passing session removes its whole base temp dir, and only one earlier session's dirs are kept
# (failed tests keep theirs for debugging). The temp root stays pytest's default; set
# PYTEST_DEBUG_TEMPROOT to move it, e.g. to a RAM disk.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
