[pytest]
# The oldest pytest the suite supports: tests/conftest.py needs item.path (pytest 7.0) and the temp-dir
# retention options below need 7.3. An older pytest stops here with a usage error naming both versions,
# before any conftest loads. CI pins a newer release in .github/workflows/validate.yml.
minversion = 7.3
# Keep pytest's temp dirs small on shared hosts: a passing test's tmp_path is removed when it ends,
# a passing session removes its whole base temp dir, and only one earlier session's dirs are kept
# (failed tests keep theirs for debugging). On Linux, tests/conftest.py puts the temp root on /dev/shm
# when it is a writable tmpfs with at least 2 GB free; TTP_TEST_TMPFS=0 turns that off. It stays pytest's
# default on CI (CI or GITHUB_ACTIONS set), under `ttp checks`, when TMPDIR, TMP, TEMP, --basetemp or
# PYTEST_DEBUG_TEMPROOT chooses the temp root, and off Linux. Under `ttp checks` the run's TMPDIR is the temp
# root: the checks runner puts it on /dev/shm when that has room (plugins/tt-project/docs/guide.md).
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
