name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 pyyaml==6.0.3
      - name: Enforce plugin version bumps
        if: github.event_name == 'pull_request'
        run: python scripts/check_plugin_versions.py "${{ github.event.pull_request.base.sha }}"
      - name: Verify generated review plugin
        run: python scripts/sync_review_plugin.py --check
      - name: Test catalogues and skills
        run: pytest tests/
